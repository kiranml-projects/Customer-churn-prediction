[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["common", "ingestion", "preprocess", "train", "evaluate", "serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "data/scripts"]
